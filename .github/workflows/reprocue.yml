# Copy to .github/workflows/reprocue.yml. Use the reprocue label to opt in.
name: Verify bug fix
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, edited]

permissions:
  contents: read

jobs:
  reprocue:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'reprocue') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read the reproduction path
        id: scenario
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! spec=$(awk '
            /^ReproCue-Spec:/ {
              sub(/^ReproCue-Spec:[[:blank:]]*/, "")
              sub(/[[:space:]]+$/, "")
              selected = $0
              matches++
            }
            END {
              if (matches != 1 || selected == "" || selected ~ /[[:cntrl:]]/) exit 1
              print selected
            }
          ' <<< "$PR_BODY"); then
            echo '::error::Add exactly one ReproCue-Spec: tests/example.spec.mjs line to the PR description.'
            exit 1
          fi
          printf 'spec=%s\n' "$spec" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # Install browsers for both revisions if their Playwright versions differ.
      - name: Install Playwright Chromium
        run: npm ci && npm exec -- playwright install --with-deps chromium
      - uses: zyw0815/ReproCue@0a1d8f5034abab8cabba372ee8e759064f2ffdb7
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          spec: ${{ steps.scenario.outputs.spec }}
